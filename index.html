<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>teamo</title>
  <link rel="stylesheet" href="./style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="apple-touch-icon" href="imagenes/icon.jpg">
  <link rel="icon" type="image/png" href="imagenes/icon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Balthazar&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <p id="dailysong" class="cursor typewriter-animation">Escuche esto y pense en vos 💌</p>   
  <button id="openCointainer">Show</button>
      <div class="container">
        <p class="letra" id="letra"></p>
        <a class="spotify_card" id = "spotify_card" href="">
        <img class="spotify_img" id="spotify_img" src="" alt="" />
        <div class="spotify_info">
            <span class="spotify_name" id="spotify_name"></span><br />
            <span class="spotify_artist" id="spotify_artist"></span>
        </div>
        </a>
        <span class="fecha" id="fecha"></span>
      </div>

    <div id="daysTogetherCont">
      <span id="diasJuntos">Dias Juntos:</span> <br>
      <span id="daysTogether"></span>
    </div> 

  <div class="history">

  <a class="spotify_card" id = "history_card">
    <p class="fecha" id="history-date"></p>
    <p class="letra" id="history-lyric"></p>
    <img class="spotify_img" id="history-img" src="" alt="">
    <p class="spotify_name" id="history-song"></p>
    <p class="spotify_artist" id="history-artist"></p>
  </a>
  </div>

  <div id="botones">
    <button id="prev">←</button>
    <button id="next">→</button>  
  </div>

  <script src="scripts/script.js"></script>
</body>

</html>
